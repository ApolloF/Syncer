name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Read-only by default; only the release job below gets more.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x' # latest patch: releases ship Go's security fixes
          check-latest: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Install NSIS
        run: |
          choco install nsis --version 3.13.0 -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Check frontend
        working-directory: frontend
        run: npm run check

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Test
        run: go test ./...

      - name: Test (personal build)
        # The personal build is tested too (see internal/features).
        run: go test -tags personal ./...

      - name: Version
        # Release builds carry their tag (shown in the app, used by the update
        # check) and put it in the exe's file properties; others are "dev".
        run: |
          $v = 'dev'
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME
            if ($v -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Unexpected release tag: $v" }
            $j = Get-Content wails.json -Raw | ConvertFrom-Json
            $j.info.productVersion = ($v.TrimStart('v') -split '[-+]')[0]
            $j | ConvertTo-Json -Depth 10 | Set-Content wails.json -Encoding utf8
          }
          "SYNCER_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        # The public release: no build tags, so no mods, Google sign-in or
        # launcher integration, and no Google OAuth client. The personal build
        # (wails build -tags personal) is made locally, with GDRIVE_CLIENT_ID /
        # GDRIVE_CLIENT_SECRET passed as -X main.gdriveClientID / gdriveClientSecret.
        run: wails build -clean -nsis -trimpath -ldflags "-s -w -X main.version=$env:SYNCER_VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Syncer
          path: |
            build/bin/Syncer.exe
            build/bin/Syncer-amd64-installer.exe

  release:
    # Only for tags; pull requests never get a token that can write.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
      id-token: write # sign the provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false # this job holds the signing key; no restored cache may run in it

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Syncer
          path: dist

      - name: Checksums
        working-directory: dist
        run: sha256sum Syncer.exe Syncer-amd64-installer.exe | tee SHA256SUMS.txt

      - name: Sign the checksums
        # The app installs only an exe whose hash is in a sums file signed with
        # this key (see RELEASING.md); a release without it must not be made.
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::The RELEASE_SIGNING_KEY secret is empty."
            exit 1
          fi
          go run ./tools/release-sign -sign dist/SHA256SUMS.txt -tag "$GITHUB_REF_NAME" -key-env RELEASE_SIGNING_KEY

      - name: Check the signature against the key in the app
        # Fails when the secret doesn't belong to the public key in pubkey.go
        # (or that is still the placeholder): such a release would install nowhere.
        # A key-change release is signed with the old key: RELEASING.md says how.
        env:
          PUBKEY_FILE: ${{ vars.RELEASE_PUBKEY_FILE }}
        run: go run ./tools/release-sign -verify dist/SHA256SUMS.txt -tag "$GITHUB_REF_NAME" -pubfile "${PUBKEY_FILE:-internal/update/pubkey.go}"

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/Syncer.exe
            dist/Syncer-amd64-installer.exe

      - name: Draft release
        # A draft: the owner smoke-tests the assets and publishes by hand (see
        # RELEASING.md). A tag with a "-" (v1.2.0-rc1) is a pre-release.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Syncer-amd64-installer.exe
            dist/Syncer.exe
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.sig
