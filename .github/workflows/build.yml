name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x' # latest patch: releases ship Go's security fixes
          check-latest: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails + NSIS
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Check frontend
        working-directory: frontend
        run: npm run check

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Test
        # Both builds: the public one (no tags) and the personal one (see internal/features).
        run: |
          go test ./...
          go test -tags personal ./...

      - name: Version
        # Release builds carry their tag (shown in the app, used by the update
        # check) and put it in the exe's file properties; others are "dev".
        run: |
          $v = 'dev'
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME
            $j = Get-Content wails.json -Raw | ConvertFrom-Json
            $j.info.productVersion = ($v.TrimStart('v') -split '[-+]')[0]
            $j | ConvertTo-Json -Depth 10 | Set-Content wails.json -Encoding utf8
          }
          "SYNCER_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        # The public release: no build tags, so no mods, Google sign-in or
        # launcher integration, and no Google OAuth client. The personal build
        # (wails build -tags personal) is made locally, with GDRIVE_CLIENT_ID /
        # GDRIVE_CLIENT_SECRET passed as -X main.gdriveClientID / gdriveClientSecret.
        run: wails build -clean -nsis -trimpath -ldflags "-s -w -X main.version=${{ env.SYNCER_VERSION }}"

      - uses: actions/upload-artifact@v4
        with:
          name: Syncer
          path: |
            build/bin/Syncer.exe
            build/bin/Syncer-amd64-installer.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/bin/Syncer-amd64-installer.exe
            build/bin/Syncer.exe
